name: Build AstroArch x86-64 image (BIOS + UEFI)

on:
  workflow_dispatch:
    inputs:
      astroarch_repo:
        description: 'astroarch repository to build (GitHub URL)'
        default: 'https://github.com/devDucks/astroarch.git'
      astroarch_branch:
        description: 'astroarch branch'
        default: 'main'
  push:
    tags: [ "img-v*" ]

permissions:
  contents: write

jobs:
  image:
    name: x86-64 image
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The rootfs (~15 GB) and the 20 GB sparse image need room
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      # The "docker" driver (not the default "docker-container" one) so that the second build can
      # use the base image the first one loaded: FROM archlinux-x86-64:latest is a local image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # Secure Boot: put the secrets MOK_KEY and MOK_CRT (PEM, from scripts/gen-mok.sh) in the repository.
      # The private key is embedded in the image (updates are signed on the machine): such an image
      # is NOT published as a release, only kept as a private artifact
      - name: Secure Boot keys
        env:
          MOK_KEY: ${{ secrets.MOK_KEY }}
          MOK_CRT: ${{ secrets.MOK_CRT }}
        run: |
          if [ -n "$MOK_KEY" ] && [ -n "$MOK_CRT" ]; then
            mkdir -p secureboot
            printf '%s\n' "$MOK_KEY" > secureboot/MOK.key
            printf '%s\n' "$MOK_CRT" > secureboot/MOK.crt
            chmod 600 secureboot/MOK.key
            echo "SB=1" >> "$GITHUB_ENV"
          fi

      - name: Build the rootfs and assemble the image
        run: |
          REPO="${{ inputs.astroarch_repo || 'https://github.com/devDucks/astroarch.git' }}"
          BRANCH="${{ inputs.astroarch_branch || 'main' }}"
          # astroarch_build.sh is downloaded from the same branch: GitHub URLs only
          RAW="https://raw.githubusercontent.com/${REPO#https://github.com/}"
          RAW="${RAW%.git}/refs/heads/${BRANCH}"
          make prepare-img SECURE_BOOT="${SB:-0}" ASTROARCH_REPO="$REPO" ASTROARCH_BRANCH="$BRANCH" ASTROARCH_RAW="$RAW"

      - name: Shrink and compress
        run: |
          VERSION=$(date +%Y%m%d)
          wget -q https://raw.githubusercontent.com/Drewsif/PiShrink/master/pishrink.sh
          chmod +x pishrink.sh
          sudo ./pishrink.sh -za archlinux-pc-x86_64.img "astroarch-x86_64-${VERSION}.img.gz"
          sha256sum "astroarch-x86_64-${VERSION}.img.gz" > "astroarch-x86_64-${VERSION}.img.gz.sha256"
          ls -lh astroarch-x86_64-*

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: astroarch-x86_64
          path: |
            astroarch-x86_64-*.img.gz
            astroarch-x86_64-*.img.gz.sha256
          retention-days: 14

      - name: Release (tags img-v*)
        if: startsWith(github.ref, 'refs/tags/img-v') && env.SB != '1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            astroarch-x86_64-*.img.gz
            astroarch-x86_64-*.img.gz.sha256
