name: Build & Push Docker image (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*", "release-*" ]
  schedule:
    - cron: '0 0 * * 0' # Every sunday at midnight

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository_owner }}/archlinux-x86-64
  ASTROARCH_IMAGE_NAME: ${{ github.repository_owner }}/astroarch-x86-64

jobs:
  build:
    name: Build${{ github.event_name == 'pull_request' && ' (no push)' || '' }}
    runs-on: ubuntu-latest

    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Native x86-64 build: no QEMU needed
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (base)
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build base (and push when not a PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.base
          target: builder
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Extract Docker metadata (astroarch)
        id: meta-astroarch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ASTROARCH_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build astroarch (weekly, and push when not a PR)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.astroarch
          target: builder
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-astroarch.outputs.tags }}
          labels: ${{ steps.meta-astroarch.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
