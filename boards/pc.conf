# Board profile: x86-64 PC / mini PC (BIOS and UEFI)
# One disk image that boots in both modes, two partitions, MBR partition table:
#   1. /boot  FAT32, label ASTROARCH_B, 512 MiB: kernel, initramfs, microcode, GRUB.
#             Partition type ef (EFI System Partition) and active flag, so the UEFI firmware
#             reads it too: GRUB is installed in the "removable" location EFI/BOOT/BOOTX64.EFI
#             (no NVRAM entry, the image boots on any machine).
#   2. /      ext4, label ASTROARCH_ROOT, the rest of the disk.
# BIOS: GRUB's boot code sits in the gap before partition 1 (hence BOOT_START=2048).
# A FAT label holds 11 characters at most: ASTROARCH_BOOT (14) cannot be one.
# Secure Boot is not supported (GRUB is not signed): disable it in the firmware.

BOOT_START=2048                 # 1MiB (512b sectors): room for GRUB's core image before /boot
BOOT_MB=512                     # size of /boot (also the ESP)
CONSOLE="tty0"                  # kernel console(s), e.g. "ttyS0,115200 tty0" for a serial one
