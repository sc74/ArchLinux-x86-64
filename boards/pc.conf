# Board profile: x86-64 PC / mini PC (BIOS and UEFI)
# One disk image that boots in both modes. MBR partition table: GRUB's BIOS boot code sits in the
# gap before partition 1, and partition 1 is an EFI System Partition (type ef) that the UEFI
# firmware reads on an MBR disk too. GRUB is also installed in the "removable" location of the ESP
# (EFI/BOOT/BOOTX64.EFI), so the image needs no NVRAM entry and boots on any machine.
# Kernel, initramfs and grub.cfg live on the ext4 root (/boot); the ESP is mounted on /boot/efi.
# Secure Boot is not supported (GRUB is not signed).

BOOT_START=2048                 # 1MiB (512b sectors): room for GRUB's core image before the ESP
BOOT_MB=512                     # size of the ESP
CONSOLE="tty0"                  # kernel console(s), e.g. "ttyS0,115200 tty0" for a serial one
